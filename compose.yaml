services:
  vermietluchs:
    image: ghcr.io/codeopsms/vermietluchs:${VERMIETLUCHS_VERSION:-latest}
    pull_policy: always
    container_name: vermietluchs
    restart: unless-stopped
    ports:
      - '3001:3001'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      VERMIETLUCHS_PORT: '3001'
      VERMIETLUCHS_HOST: 0.0.0.0
      VERMIETLUCHS_DATA_DIR: /data
      VERMIETLUCHS_ALLOWED_HOSTS: ${VERMIETLUCHS_ALLOWED_HOSTS:-}
      VERMIETLUCHS_LOG_LEVEL: ${VERMIETLUCHS_LOG_LEVEL:-info}
      VERMIETLUCHS_LOG_VALUES: ${VERMIETLUCHS_LOG_VALUES:-true}
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    volumes:
      - vermietluchs-data:/data

volumes:
  vermietluchs-data:
    name: vermietluchs-data
